name: Publier sur Facebook

on:
  push:
    branches: [main]
    paths: ["a-publier/**"]
  workflow_dispatch: {}

concurrency:
  group: publier-facebook
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publier les Reels en attente
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_VIDEO_STATE: ${{ vars.FB_VIDEO_STATE }}
        run: node scripts/publier.mjs

      - name: Ranger les vidéos publiées
        if: always()
        run: |
          git config user.name "blague-du-jour-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A a-publier publies
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publié sur Facebook [skip ci]"
          git pull --rebase
          git push
