name: Publier sur Facebook

on:
  push:
    branches: [main]
    paths: ["a-publier/**"]
  workflow_dispatch: {}
  # Rattrapage : une image sortie de rattrapage/ chaque heure, de 8 h à 22 h (heure de Paris).
  schedule:
    - cron: "17 6-20 * * *"

concurrency:
  group: publier-facebook
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Toujours repartir du main le plus récent : une exécution mise en file d'attente
      # ne doit pas republier ce qu'une exécution précédente a déjà publié.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sortir une image du rattrapage
        if: github.event_name == 'schedule'
        run: |
          f=$(ls rattrapage/*.png 2>/dev/null | sort | head -1)
          if [ -z "$f" ]; then echo "Rattrapage terminé."; exit 0; fi
          mv "$f" "${f%.png}.json" a-publier/

      - name: Publier les Reels en attente
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_VIDEO_STATE: ${{ vars.FB_VIDEO_STATE }}
        run: node scripts/publier.mjs

      - name: Ranger les vidéos publiées
        if: always()
        run: |
          git config user.name "blague-du-jour-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A a-publier publies rattrapage
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publié sur Facebook [skip ci]"
          git pull --rebase
          git push
